name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The tests create and drop their own throwaway databases through the admin URL (tests/helpers/global-setup.ts),
      # so no database has to exist beforehand. These credentials belong to the disposable service container above.
      PG_ADMIN_URL: postgres://postgres:ci@localhost:5432/postgres
      DATABASE_URL: postgres://postgres:ci@localhost:5432/option_trading
    steps:
      - uses: actions/checkout@v4
      # pnpm's version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:web
      - run: pnpm test

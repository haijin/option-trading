name: Bug report
description: Something in the app, the CLI or the scanner does not work as described.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not paste your `.env`, API keys, session cookies, or your own positions and journal.** Sample
        values are enough. For a security problem, use the private advisory in the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did and what you saw, including the page or the command.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest sequence that shows it. Does it happen with `pnpm demo` (the sample-data mock), or only with a real database?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit hash (`git rev-parse --short HEAD`) or tag.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js, pnpm and PostgreSQL versions.
      placeholder: Windows 11, Node 22.x, pnpm 10.x, PostgreSQL 16.x
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: The terminal output or the server log, with secrets removed.
      render: shell
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Before you submit
      options:
        - label: I removed secrets and personal data from everything above.
          required: true
